<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anteprima emoji animate</title>
    <style>
      :root { --bg: #14172b; --card: #1d213d; --ink: #e9ebff; --muted: #8a90b8; --accent: #ffb300; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 14px system-ui, sans-serif; }
      body.light { --bg: #f3f4fa; --card: #fff; --ink: #14172b; --muted: #5b6190; }
      header { position: sticky; top: 0; z-index: 2; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; padding: 12px 16px; background: var(--bg); border-bottom: 1px solid #ffffff1a; }
      input, select, button { font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid #ffffff2a; background: var(--card); color: var(--ink); }
      input { width: 220px; }
      button { cursor: pointer; }
      #count { color: var(--muted); margin-left: auto; }
      #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; padding: 16px; }
      .card { background: var(--card); border-radius: 12px; padding: 10px; text-align: center; cursor: pointer; border: 2px solid transparent; }
      .card:hover { border-color: var(--accent); }
      .thumb { width: 100%; aspect-ratio: 1; }
      .label { margin-top: 6px; font-size: 13px; }
      .label small { display: block; color: var(--muted); font-size: 11px; }
      #modal { position: fixed; inset: 0; display: none; place-items: center; background: #000a; z-index: 3; }
      #modal.open { display: grid; }
      #panel { background: var(--card); border-radius: 16px; padding: 20px; width: min(560px, 94vw); max-height: 96vh; overflow: auto; }
      #big { width: 100%; aspect-ratio: 1; background: repeating-conic-gradient(#8883 0 25%, #0000 0 50%) 50% / 24px 24px; border-radius: 12px; }
      #controls { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
      #seek { flex: 1; }
      #meta { color: var(--muted); margin-top: 8px; font-size: 13px; }
      #empty { padding: 40px; color: var(--muted); text-align: center; }
    </style>
    <script src="/vendor/lottie.js"></script>
  </head>
  <body>
    <header>
      <input id="q" type="search" placeholder="Cerca: 🚀 oppure 1f680" autofocus />
      <select id="set"><option value="">Tutti i set</option></select>
      <button id="theme" type="button">Sfondo chiaro/scuro</button>
      <span id="count"></span>
    </header>
    <main id="grid"></main>
    <div id="empty" hidden>Nessuna emoji trovata.</div>

    <div id="modal">
      <div id="panel">
        <div id="big"></div>
        <div id="controls">
          <button id="play" type="button">⏸ Pausa</button>
          <input id="seek" type="range" min="0" value="0" />
          <span id="frame"></span>
        </div>
        <div id="meta"></div>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      let manifest = [];
      const live = new Map(); // card -> animazione attiva (si crea solo quando la card è visibile)

      // Normalizza la ricerca: emoji (senza selettore di variazione) oppure id/codepoint
      const norm = (s) => s.replace(/️/g, "").trim().toLowerCase();
      const matches = (e, q) => !q || norm(e.emoji).includes(q) || e.id.includes(q) || e.file.toLowerCase().includes(q);

      // Anima le card solo quando entrano in vista: con centinaia di emoji evita di rallentare il browser
      const observer = new IntersectionObserver((entries) => {
        for (const { target, isIntersecting } of entries) isIntersecting ? start(target) : stop(target);
      }, { rootMargin: "200px" });

      function start(card) {
        if (live.has(card)) return;
        const anim = lottie.loadAnimation({ container: card.querySelector(".thumb"), renderer: "svg", loop: true, autoplay: true, path: "/lottie/" + encodeURI(card.dataset.file) });
        live.set(card, anim);
      }
      function stop(card) {
        live.get(card)?.destroy();
        live.delete(card);
      }

      function makeCard(e) {
        const card = document.createElement("div");
        card.className = "card";
        card.dataset.file = e.file;
        card.innerHTML = `<div class="thumb"></div><div class="label">${e.emoji || "·"} <small>${e.id}</small></div>`;
        card.onclick = () => openModal(e);
        return card;
      }

      function render() {
        const q = norm($("q").value), set = $("set").value;
        const items = manifest.filter((e) => (!set || e.set === set) && matches(e, q));
        for (const card of live.keys()) stop(card);
        observer.disconnect();
        $("grid").replaceChildren(...items.map(makeCard));
        $("grid").querySelectorAll(".card").forEach((c) => observer.observe(c));
        $("count").textContent = `${items.length} / ${manifest.length}`;
        $("empty").hidden = items.length > 0;
      }

      // Finestra di dettaglio: play/pausa e seek frame per frame
      let big = null;
      function openModal(e) {
        $("modal").classList.add("open");
        big?.destroy();
        big = lottie.loadAnimation({ container: $("big"), renderer: "svg", loop: true, autoplay: true, path: "/lottie/" + encodeURI(e.file) });
        big.addEventListener("DOMLoaded", () => { $("seek").max = big.totalFrames - 1; });
        big.addEventListener("enterFrame", () => { $("seek").value = Math.floor(big.currentFrame); $("frame").textContent = `${Math.floor(big.currentFrame)} / ${Math.floor(big.totalFrames) - 1}`; });
        $("play").textContent = "⏸ Pausa";
        $("meta").textContent = `${e.emoji} ${e.set}/${e.id} · ${e.fps} fps · ${e.durationInFrames} frame · ${e.durationInSeconds}s · ${e.width}×${e.height}`;
      }
      function closeModal() { $("modal").classList.remove("open"); big?.destroy(); big = null; }

      $("modal").onclick = (ev) => ev.target === $("modal") && closeModal();
      document.onkeydown = (ev) => ev.key === "Escape" && closeModal();
      $("play").onclick = () => { if (big.isPaused) { big.play(); $("play").textContent = "⏸ Pausa"; } else { big.pause(); $("play").textContent = "▶ Play"; } };
      $("seek").oninput = () => { big.goToAndStop(Number($("seek").value), true); $("play").textContent = "▶ Play"; };
      $("theme").onclick = () => document.body.classList.toggle("light");
      $("q").oninput = $("set").onchange = render;

      (async function init() {
        manifest = await (await fetch("/lottie/manifest.json")).json();
        for (const s of [...new Set(manifest.map((e) => e.set))]) $("set").add(new Option(s, s));
        $("q").value = new URLSearchParams(location.search).get("q") ?? "";
        render();
      })();
    </script>
  </body>
</html>
